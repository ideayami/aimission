<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
  <title>2Dシューティングゲーム</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <div class="game-wrapper">
      <canvas id="gameCanvas" width="480" height="640"></canvas>
      <!-- 一時停止トグルボタン -->
      <button id="pauseButton" class="pause-button" title="一時停止 (P)">❚❚</button>
      <!-- 初回スタート画面オーバーレイ（音声有効化のため） -->
      <div id="startScreen" class="game-over-screen">
        <h2 style="color: #66fcf1;">SPACE SHOOTER</h2>
        <p>宇宙を防衛せよ！</p>
        <p>ハイスコア: <span id="startHighScore">0</span></p>
        <button id="startButton">ゲームスタート</button>
        <p class="restart-hint">[スペースキー] または [クリック] で開始</p>
      </div>
      <!-- ポーズ画面オーバーレイ -->
      <div id="pauseScreen" class="game-over-screen hidden">
        <h2 style="color: #66fcf1;">PAUSED</h2>
        <p>ゲーム一時停止中</p>
        <button id="resumeButton">再開する</button>
        <p class="restart-hint">[Pキー] でも再開</p>
      </div>
      <!-- ゲームオーバー画面オーバーレイ -->
      <div id="gameOverScreen" class="game-over-screen hidden">
        <h2 id="gameOverTitle">GAME OVER</h2>
        <p>スコア: <span id="finalScore">0</span></p>
        <p>ハイスコア: <span id="highScore">0</span></p>
        <button id="restartButton">リスタート</button>
        <p class="restart-hint">[スペースキー] でもリスタート</p>
      </div>
    </div>
    <!-- モバイル用オン画面タッチコントロール -->
    <div class="touch-controls" id="touchControls">
      <div class="touch-move-group">
        <button type="button" class="touch-btn" id="touchLeft" aria-label="左移動">◀</button>
        <button type="button" class="touch-btn" id="touchRight" aria-label="右移動">▶</button>
      </div>
      <div class="touch-action-group">
        <button type="button" class="touch-btn touch-btn-action" id="touchShoot" aria-label="弾発射">SHOT</button>
      </div>
    </div>
    <div class="instructions">
      <p>操作方法: [矢印キー] / [WASD] / [画面ボタン] で移動 | [スペースキー] / [SHOT] で発射 | [P] で一時停止</p>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
